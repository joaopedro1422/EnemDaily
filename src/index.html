<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>enem.daily</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="4 questões do ENEM por dia, uma de cada área. Construa seu campus, dispute com amigos e chegue pronto na prova.">
  <meta name="theme-color" content="#F3F5F9">
  <meta name="application-name" content="enem.daily">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="enem.daily">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://fonts.cdnfonts.com/css/codec-pro" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&amp;family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer"/>
  <style>
    /* abertura: aparece antes do Angular carregar e sai quando a primeira tela está pronta */
    #ed-splash { position: fixed; inset: 0; z-index: 99999; display: grid; place-items: center; background: radial-gradient(120% 90% at 50% 0%, #3442D8 0%, #1C2590 50%, #0F1550 100%); color: #FFFFFF; font-family: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif; transition: opacity 420ms ease, transform 420ms ease; }
    #ed-splash::before { content: ''; position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,.13) 1.2px, transparent 1.3px); background-size: 20px 20px; -webkit-mask-image: radial-gradient(circle at 50% 42%, #000, transparent 70%); mask-image: radial-gradient(circle at 50% 42%, #000, transparent 70%); }
    #ed-splash.sair { opacity: 0; transform: scale(1.04); pointer-events: none; }
    .sp-marca { position: relative; display: grid; justify-items: center; gap: 14px; }
    .sp-simbolo { width: 104px; height: 104px; overflow: visible; }
    .sp-anel { fill: none; stroke: #FFFFFF; stroke-width: 5.6; transform-box: fill-box; transform-origin: center; animation: sp-anel 520ms cubic-bezier(.34, 1.5, .64, 1) calc(var(--i) * 90ms) both; }
    .sp-ponto { fill: #FFFFFF; transform-box: fill-box; transform-origin: center; animation: sp-ponto 460ms cubic-bezier(.34, 1.7, .64, 1) calc(420ms + var(--i) * 150ms) both; }
    .sp-ponto.ouro { fill: #FFD66B; }
    .sp-nome { font-size: 30px; font-weight: 800; letter-spacing: -.035em; animation: sp-sobe 520ms cubic-bezier(.2, .9, .25, 1) 760ms both; }
    .sp-nome i { display: inline-block; width: 7px; height: 7px; margin: 0 2px 2px; border-radius: 50%; background: #FFD66B; }
    .sp-lema { font-size: 12.5px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: rgba(255,255,255,.7); animation: sp-sobe 520ms cubic-bezier(.2, .9, .25, 1) 900ms both; }
    @keyframes sp-anel { from { transform: scale(0); opacity: 0; } }
    @keyframes sp-ponto { from { transform: scale(0); } 60% { transform: scale(1.18); } }
    @keyframes sp-sobe { from { transform: translateY(10px); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .sp-anel, .sp-ponto, .sp-nome, .sp-lema { animation: none; } }
    #ed-carregando-inicial { z-index: 99999; transition: opacity 240ms ease; }
    #ed-carregando-inicial.sair { opacity: 0; pointer-events: none; }
  </style>
  <script>
    // guarda o convite de instalação mesmo que ele chegue antes do Angular
    window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.__edInstalar = e; window.dispatchEvent(new Event('ed-instalavel')); });
    window.__edInicio = Date.now();
  </script>
</head>
<body>
  <div id="ed-splash" role="status" aria-label="Abrindo o enem.daily">
    <div class="sp-marca">
      <svg class="sp-simbolo" viewBox="0 0 100 100" aria-hidden="true">
        <circle class="sp-anel" style="--i:0" cx="32.5" cy="32.5" r="13.2"/><circle class="sp-anel" style="--i:1" cx="67.5" cy="32.5" r="13.2"/>
        <circle class="sp-anel" style="--i:2" cx="32.5" cy="67.5" r="13.2"/><circle class="sp-anel" style="--i:3" cx="67.5" cy="67.5" r="13.2"/>
        <circle class="sp-ponto" style="--i:0" cx="32.5" cy="32.5" r="7.6"/><circle class="sp-ponto" style="--i:1" cx="67.5" cy="32.5" r="7.6"/>
        <circle class="sp-ponto" style="--i:2" cx="32.5" cy="67.5" r="7.6"/><circle class="sp-ponto ouro" style="--i:3" cx="67.5" cy="67.5" r="7.6"/>
      </svg>
      <div class="sp-nome">enem<i></i>daily</div>
    </div>
  </div>
  <!-- no navegador, só a animação de carregamento enquanto o app busca os dados -->
  <div id="ed-carregando-inicial" class="ed-abertura" role="status" aria-label="Carregando enem.daily">
    <span class="ed-carregando">
      <svg viewBox="0 0 100 100" aria-hidden="true"><g class="q">
        <circle class="a" cx="32.5" cy="32.5" r="13.2"/><circle class="a" cx="67.5" cy="32.5" r="13.2"/><circle class="a" cx="67.5" cy="67.5" r="13.2"/><circle class="a" cx="32.5" cy="67.5" r="13.2"/>
        <circle class="p p1" cx="32.5" cy="32.5" r="7.6"/><circle class="p p2" cx="67.5" cy="32.5" r="7.6"/><circle class="p p3" cx="67.5" cy="67.5" r="7.6"/><circle class="p p4" cx="32.5" cy="67.5" r="7.6"/>
      </g></svg>
    </span>
  </div>
  <script>
    (function () {
      var app = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
      // ?abertura=app mostra a abertura completa no navegador, para conferir
      if (/[?&]abertura=app/.test(location.search)) app = true;
      window.__edApp = app;
      // a abertura azul é só do app instalado; no navegador fica só o carregamento
      document.getElementById(app ? 'ed-carregando-inicial' : 'ed-splash').remove();
      // a contagem só começa quando a abertura aparece de fato; o último ponto (dourado) marca o fim da animação
      requestAnimationFrame(function () { window.__edInicio = Date.now(); });
      var ouro = document.querySelector('#ed-splash .sp-nome');
      if (ouro) ouro.addEventListener('animationend', function () { window.__edAnimou = true; });
      // segurança: nunca prende a pessoa na abertura
      setTimeout(function () { var s = document.getElementById('ed-splash') || document.getElementById('ed-carregando-inicial'); if (s) { s.classList.add('sair'); setTimeout(function () { s.remove(); }, 450); } }, 9000);
    })();
  </script>
  <app-root></app-root>
  <noscript>Ative o JavaScript para usar o enem.daily.</noscript>
</body>
</html>
