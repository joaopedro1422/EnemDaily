spring.application.name=EnemDaily-backend
spring.config.import=optional:file:./local.properties
server.port=${PORT:8080}

spring.datasource.url=${DATABASE_JDBC_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:EnemDaily}}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET}

enemdaily.ia.chave=${OPENAI_API_KEY:}
enemdaily.ia.modelo=gpt-5.5
enemdaily.ia.esforco.elaborar=xhigh
enemdaily.ia.esforco.resolver=high
enemdaily.ia.esforco.revisar=medium
enemdaily.ia.esforco.conteudo=high
enemdaily.ia.max-saida=64000
enemdaily.ia.background=true
enemdaily.ia.limite-minutos=30
enemdaily.ia.max-rascunhos=2
enemdaily.ia.max-revisoes=2
enemdaily.ia.areas-em-paralelo=4
enemdaily.geracao.agendada=${GERACAO_AGENDADA:false}
enemdaily.questao.data-fixa=${QUESTAO_DATA_FIXA:2026-11-21}
enemdaily.admin.chave=${ENEMDAILY_ADMIN_CHAVE:}
enemdaily.modo-teste=${MODO_TESTE:false}
enemdaily.vercel.deploy-hook=${VERCEL_DEPLOY_HOOK:}
enemdaily.cors.origens=${CORS_ORIGENS:*}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:enemdaily@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
